# Provider defaults shipped with coding-agent (ADR 014).
#
# This file is layer 0: user config (~/.config/coding-agent/config.toml)
# and project config (.coding-agent/config.toml) overlay it, so every
# value here can be overridden per user or per project. It is versioned
# with the app — do not edit; add your settings to your own config files.
#
# Fields per [providers.<name>] entry:
#   provider = "openai"   ride an OpenAI-compatible req_llm provider
#                         module (needed when the native provider of the
#                         same name can't do the job, e.g. req_llm's
#                         :ollama provider never sends auth)
#   base_url  = "..."     endpoint override
#   backend   = "ollama"  sets openai_compatible_backend (required for
#                         ollama-hosted backends riding :openai)
#   discover  = "openai"  model-list source for the model menu:
#                         "openai" (GET base_url + /models) or
#                         "ollama" (GET base_url + /api/tags)
#
# Catalog providers (openai, anthropic, github_copilot, ...) need no
# entry — their model lists come from req_llm's catalog and their auth
# from req_llm's chain (env / OAuth).

[providers.ollama]
base_url = "http://localhost:11434/v1"
discover = "ollama"

[providers.ollama_cloud]
provider = "openai"
base_url = "https://ollama.com/v1"
backend = "ollama"
discover = "openai"

# Deployment-specific proxies (base_url is per installation) ship as
# examples only — uncomment and fill in your endpoint in YOUR
# config.toml, not here:
#
# [providers.litellm]
# provider = "openai"
# base_url = "http://localhost:4000/v1"
# discover = "openai"

# Sandbox mount schema (ADR 015). Applies only when a confining sandbox
# is active (Linux with bubblewrap); with no sandbox these are ignored.
#
#   rw   = [...]   bind read-write, shared with the host
#   ro   = [...]   bind read-only
#   hide = [...]   a dir becomes an empty tmpfs, a file becomes /dev/null
#
# `rw` ADDS reach, so it is honoured only from this shipped file and your
# own ~/.config/coding-agent/config.toml — never from a project's
# .coding-agent/config.toml (a checked-out repo must not widen its own
# sandbox). `ro`/`hide` may come from any layer because they only tighten.
#
# Toolchain caches are shared read-write by default so builds do not
# re-download in every session; add your own paths as needed.

[sandbox]
rw = [
  "~/.cache",
  "~/.hex",
  "~/.mix",
  "~/.m2",
  "~/.gradle",
  "~/.cargo",
  "~/.npm",
  "~/.config/git",
]
ro = []
hide = []

# Per-turn tool-round budget (ADR 025). A "round" is one assistant
# response containing tool calls; the counter resets with each new user
# prompt. At the budget the interactive TUI ASKS whether to continue
# (another full budget) or stop (the model summarizes and the turn ends);
# a non-interactive driver summarizes automatically. An agent definition's
# `maxTurns` overrides this per agent.
#
#   max_tool_rounds = 100

# Session stores (ADR 020 R16). A store is the selectable place sessions
# are kept (target: one SQLite DB holding many sessions; until that
# engine lands, a directory of session files — the selector is the same).
# Keep several (one per client/project) and choose one explicitly.
#
#   store = "<name|path>"   the default store for every run
#   [stores]                named stores: name -> absolute path
#
# Selection precedence: `--store` flag > AGENT_STORE env > `store =` here
# > the default (~/.local/state/coding_agent/store.db). A selector that cannot be
# resolved is an error, never a silent fallback.
#
# Example:
#   store = "work"
#   [stores]
#   work    = "~/.local/state/coding_agent/work.db"
#   private = "/data/agent-private.db"
