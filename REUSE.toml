# REUSE annotations for files that cannot carry an SPDX header in the file
# itself. Everything not listed here carries its headers inline; run
# `reuse lint` for the authoritative check.
version = 1

# Agent definitions start with a YAML frontmatter block ("---" on line 1).
# A leading comment would stop the frontmatter parser from seeing the
# block, so the licensing lives here instead.
[[annotations]]
path = "priv/coding-agent/agents/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Michael Jansen <ferroclass@michael-jansen.biz>"
SPDX-License-Identifier = "MPL-2.0"

# These files *are* the system prompt: every line is sent to the model, so
# an SPDX header would become prompt text. Adapted from opencode's MIT
# prompt files (see THIRD_PARTY.md); both notices apply.
[[annotations]]
path = "priv/coding-agent/prompts/*.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2025 opencode", "2026 Michael Jansen <ferroclass@michael-jansen.biz>"]
SPDX-License-Identifier = "MIT"

# Shown to the model verbatim when a hidden path is touched; a header
# would be part of the message.
[[annotations]]
path = "priv/coding-agent/sandbox/README.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Michael Jansen <ferroclass@michael-jansen.biz>"
SPDX-License-Identifier = "MPL-2.0"

# Generated by Mix (`mix deps.get` rewrites it); a header would be dropped
# on the next dependency change.
[[annotations]]
path = "mix.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Michael Jansen <ferroclass@michael-jansen.biz>"
SPDX-License-Identifier = "MPL-2.0"
